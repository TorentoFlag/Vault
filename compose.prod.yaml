name: vault

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - /opt/vault/volumes/postgres_data:/var/lib/postgresql/data
      - /opt/vault/secrets/postgres-password:/run/secrets/postgres_password:ro

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - /opt/vault/volumes/redis_data:/data

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - /opt/vault/env/backend.env
    environment:
      DATABASE_URL_FILE: /run/secrets/vault/database-url
    volumes:
      - /opt/vault/secrets:/run/secrets/vault:ro
    ports:
      - "127.0.0.1:3001:3000"

  fulfillment-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "dist/fulfillment-worker.js"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - /opt/vault/env/backend.env
    environment:
      DATABASE_URL_FILE: /run/secrets/vault/database-url
      FULFILLMENT_WORKER_INTERVAL_MS: "10000"
    volumes:
      - /opt/vault/secrets:/run/secrets/vault:ro

  notifications-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["node", "dist/notifications-worker.js", "--watch"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - /opt/vault/env/backend.env
    environment:
      DATABASE_URL_FILE: /run/secrets/vault/database-url
      NOTIFICATIONS_WORKER_INTERVAL_MS: "10000"
    volumes:
      - /opt/vault/secrets:/run/secrets/vault:ro

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: https://vaultapp24.com
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: https://vaultapp24.com
      VAULT_API_BASE_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
