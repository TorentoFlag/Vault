name: Deploy Vault production

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify backend
        run: npm --prefix backend run verify

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Validate deploy contract
        run: node --test deploy/**/*.test.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    concurrency:
      group: vault-production
      cancel-in-progress: false
    env:
      VAULT_DEPLOY_HOST: ${{ secrets.VAULT_DEPLOY_HOST }}
      VAULT_DEPLOY_USER: ${{ secrets.VAULT_DEPLOY_USER }}
      VAULT_DEPLOY_PORT: ${{ secrets.VAULT_DEPLOY_PORT }}
      VAULT_DEPLOY_SSH_KEY: ${{ secrets.VAULT_DEPLOY_SSH_KEY }}
      VAULT_DEPLOY_KNOWN_HOSTS: ${{ secrets.VAULT_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          : "${VAULT_DEPLOY_HOST:?Missing VAULT_DEPLOY_HOST}"
          : "${VAULT_DEPLOY_USER:?Missing VAULT_DEPLOY_USER}"
          : "${VAULT_DEPLOY_SSH_KEY:?Missing VAULT_DEPLOY_SSH_KEY}"
          : "${VAULT_DEPLOY_KNOWN_HOSTS:?Missing VAULT_DEPLOY_KNOWN_HOSTS}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VAULT_DEPLOY_SSH_KEY" > ~/.ssh/vault_deploy_key
          chmod 600 ~/.ssh/vault_deploy_key
          printf '%s\n' "$VAULT_DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release source
        shell: bash
        run: |
          set -euo pipefail
          deploy_port="${VAULT_DEPLOY_PORT:-22}"
          release_dir="/opt/vault/deploy-incoming/${GITHUB_SHA}"
          ssh_cmd=(ssh -i ~/.ssh/vault_deploy_key -p "$deploy_port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts)
          "${ssh_cmd[@]}" "${VAULT_DEPLOY_USER}@${VAULT_DEPLOY_HOST}" "rm -rf '$release_dir' && mkdir -p '$release_dir'"
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.secrets/' \
            --exclude='node_modules/' \
            --exclude='frontend/.next/' \
            --exclude='backend/dist/' \
            --exclude='.DS_Store' \
            -e "ssh -i ~/.ssh/vault_deploy_key -p $deploy_port -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts" \
            ./ "${VAULT_DEPLOY_USER}@${VAULT_DEPLOY_HOST}:${release_dir}/"

      - name: Install VV Admin webhook environment
        shell: bash
        env:
          VV_ADMIN_WEBHOOK_URL: ${{ secrets.VV_ADMIN_WEBHOOK_URL }}
          VV_ADMIN_WEBHOOK_SITE_KEY: ${{ secrets.VV_ADMIN_WEBHOOK_SITE_KEY }}
          VV_ADMIN_WEBHOOK_SECRET: ${{ secrets.VV_ADMIN_WEBHOOK_SECRET }}
          VV_ADMIN_WEBHOOK_SECRET_VERSION: ${{ secrets.VV_ADMIN_WEBHOOK_SECRET_VERSION }}
        run: |
          set -euo pipefail
          : "${VV_ADMIN_WEBHOOK_URL:?Missing VV_ADMIN_WEBHOOK_URL}"
          : "${VV_ADMIN_WEBHOOK_SITE_KEY:?Missing VV_ADMIN_WEBHOOK_SITE_KEY}"
          : "${VV_ADMIN_WEBHOOK_SECRET:?Missing VV_ADMIN_WEBHOOK_SECRET}"
          deploy_port="${VAULT_DEPLOY_PORT:-22}"
          ssh_cmd=(ssh -i ~/.ssh/vault_deploy_key -p "$deploy_port" -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts)
          printf '%s' "$VV_ADMIN_WEBHOOK_SECRET" | "${ssh_cmd[@]}" "${VAULT_DEPLOY_USER}@${VAULT_DEPLOY_HOST}" \
            "install -d -m 700 /opt/vault/secrets && umask 077 && cat > /opt/vault/secrets/vv-admin-webhook-secret && chmod 600 /opt/vault/secrets/vv-admin-webhook-secret"
          "${ssh_cmd[@]}" "${VAULT_DEPLOY_USER}@${VAULT_DEPLOY_HOST}" \
            "VV_ADMIN_WEBHOOK_URL='$VV_ADMIN_WEBHOOK_URL' VV_ADMIN_SITE_KEY='vault' VV_ADMIN_WEBHOOK_SITE_KEY='$VV_ADMIN_WEBHOOK_SITE_KEY' VV_ADMIN_WEBHOOK_SECRET_VERSION='${VV_ADMIN_WEBHOOK_SECRET_VERSION:-1}' sh -s" <<'REMOTE'
            set -eu
            install -d -m 700 /opt/vault/env
            env_file="/opt/vault/env/backend.env"
            touch "$env_file"
            chmod 600 "$env_file"
            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" "$env_file"; then
                sed -i "s|^${key}=.*|${key}=${value}|" "$env_file"
              else
                printf '%s=%s\n' "$key" "$value" >> "$env_file"
              fi
            }
            upsert_env VV_ADMIN_WEBHOOK_URL "$VV_ADMIN_WEBHOOK_URL"
            upsert_env VV_ADMIN_SITE_KEY "$VV_ADMIN_SITE_KEY"
            upsert_env VV_ADMIN_WEBHOOK_SITE_KEY "$VV_ADMIN_WEBHOOK_SITE_KEY"
            upsert_env VV_ADMIN_WEBHOOK_SECRET_FILE /run/secrets/vault/vv-admin-webhook-secret
            upsert_env VV_ADMIN_WEBHOOK_SECRET_VERSION "$VV_ADMIN_WEBHOOK_SECRET_VERSION"
          REMOTE

      - name: Deploy on server
        shell: bash
        run: |
          set -euo pipefail
          deploy_port="${VAULT_DEPLOY_PORT:-22}"
          release_dir="/opt/vault/deploy-incoming/${GITHUB_SHA}"
          ssh -i ~/.ssh/vault_deploy_key \
            -p "$deploy_port" \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${VAULT_DEPLOY_USER}@${VAULT_DEPLOY_HOST}" \
            "VAULT_RELEASE_DIR='$release_dir' VAULT_DEPLOY_SHA='${GITHUB_SHA}' sh '$release_dir/deploy/production-remote-deploy.sh'"
