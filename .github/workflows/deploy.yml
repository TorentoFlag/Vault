name: Deploy Vault production

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Verify backend
        run: npm --prefix backend run verify

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Run frontend tests
        run: npm --prefix frontend test

      - name: Typecheck frontend
        run: npm --prefix frontend run typecheck

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Validate deploy contract
        run: node --test deploy/**/*.test.mjs

  deploy:
    runs-on: [self-hosted, vault-stage]
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    environment: production
    concurrency:
      group: vault-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Prepare production environment
        shell: bash
        run: |
          set -euo pipefail
          test -f ~/.envs/vault/.env
          cp ~/.envs/vault/.env .env
          chmod 600 .env
          docker compose config --quiet

      - name: Build production images
        shell: bash
        run: |
          set -euo pipefail
          docker compose build backend frontend

      - name: Start dependencies
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d postgres redis
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1 \
              && docker compose exec -T redis redis-cli ping >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps postgres redis
          exit 1

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail
          docker compose run --rm --no-deps backend npm run db:migrate

      - name: Deploy application services
        shell: bash
        run: |
          set -euo pipefail
          docker compose up -d --wait --wait-timeout 180 --remove-orphans backend fulfillment-worker notifications-worker vv-admin-dispatcher-worker frontend

      - name: Verify deployed HTTP surfaces
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            http://127.0.0.1:3001/health/live \
            http://127.0.0.1:3001/health/ready \
            http://127.0.0.1:3000/ \
            https://api.vaultapp24.com/health/live \
            https://api.vaultapp24.com/health/ready \
            https://vaultapp24.com/
          do
            curl --fail --silent --show-error --retry 10 --retry-delay 2 "$url" >/dev/null
          done
          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            https://vaultapp24.com/.well-known/vv-admin/manifest.json \
            | grep -F '"storeOrders"'
          docker compose ps

      - name: Cleanup production environment file
        if: always()
        shell: bash
        run: rm -f .env
